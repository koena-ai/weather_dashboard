
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <!-- Header -->
        <header>
            <h1>🌤 Weather Dashboard</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">Search</button>

        </section>

        <!-- Error Message -->
        <p id="errorMessage" role="alert"></p>

        <!-- Loading Message -->
        <p id="loadingMessage" role="status">
            Loading weather data...
        </p>

        <!-- Current Weather -->
        <section id="currentWeather" class="current-weather">

            <h2 id="cityName">City Name</h2>

            <div class="weather-main">
                <span id="weatherIcon">☀️</span>

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="weatherDescription">Weather condition</p>
                </div>
            </div>

            <div class="weather-details">

                <div class="detail-card">
                    <span>Feels Like</span>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail-card">
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span>Wind Speed</span>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

            </div>

        </section>

        <!-- Five Day Forecast -->
        <section id="forecastSection">

            <h2>5-Day Weather Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
